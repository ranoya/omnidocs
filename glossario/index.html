    <script>
        $_GET = [];
        (function() {
            corte = window.location.href.toString().indexOf('?');
            if (corte > 0) {
                argumento = window.location.href.toString().substring(corte + 1);
                argumentos = argumento.split('&');
                for (arg in argumentos) {
                    let argCorte = argumentos[arg].indexOf('=');
                    $_GET[argumentos[arg].substring(0, argCorte)] = argumentos[arg].substring(argCorte + 1);
                }
            }

    <script>

        let mostra = function(i) {

            let link = `<p>${dataselected[i].ObraRef}</p>`;

            if (typeof $_GET['p'] != 'undefined' && $_GET['p'] != null && $_GET['p'] != '' && typeof dataselected[i].link != 'undefined' && dataselected[i].link != null && dataselected[i].link != '') {
               link = `<p><a target='blank' href='${dataselected[i].link}'>${dataselected[i].ObraRef}</a></p>`;
            }

            document.getElementById("subpalco").innerHTML = `
            
            <span class="small">Definição</span><br>
            <p class="descrit">${dataselected[i].Descricao}</p><br>
            <span class="small">Autores</span><br>
            <p>${dataselected[i].AutorPrincipal}<br>${dataselected[i].OutrosAutores}</p><br>
            <span class="small">Obra de referência</span><br>
            ${link}</p>
            
            
            `;


            document.getElementById("palco").style.display = "block";
            document.getElementById("subpalco").style.display = "block";

        }

        let fecha = function() {

            document.getElementById("palco").style.display = "none";
            document.getElementById("subpalco").style.display = "none";

        }

        let muda = function(s) {

            let inpt = document.getElementById("shadowfiltro");
            inpt.value = s;
            inpt.dispatchEvent(new Event('input', { bubbles: true }));

            omnifilter(fulldataset);


        }

        let fulldataset = [];
        let dataselected = [];
        let primeravez = true;

        omnifilter = function(dadosorig) {

            let dadosfull = alphabetic(dadosorig, "Conceito");

            fulldataset = dadosfull;


            let dadoscombrancos = selecte(dadosfull, document.getElementById("shadowfiltro").value);

            let dados = [];
            let c = 0;

            for (let i=0; i<dadoscombrancos.length; i++) {
                if (dadoscombrancos[i].Conceito != '') {
                    dados[c] = dadoscombrancos[i];
                    c++;
                }
            }

            dataselected = dados;

            let catalogos = tags(dados, "Organizacao", ";");
            let colecoes = tags(dados, "Colecoes", ";");

            if (primeravez && (typeof $_GET['nomenu'] == 'undefined' || $_GET['nomenu'] == null || $_GET['nomenu'] == '')) {
            if (catalogos.length > 1) {

                let code = "";

                for (let i=0; i<catalogos.length; i++) {
                    code += `<a href='javascript:muda("${catalogos[i]}")'>${colecoes[i]}</a> `;
                }

                document.getElementsByTagName("nav")[0].innerHTML = code;

                document.getElementsByTagName("nav")[0].style.display = "block";
                primeravez = false;
                
            } else {
                
                document.getElementsByTagName("nav")[0].style.display = "none";
                primeravez = false;
            }
            }

            let data = [];

            if (typeof $_GET['filtra'] != "undefined" && $_GET['filtra'] != "" && $_GET['filtra'] != null) {
                data = select(dados, multipatterncheck_exclude, decodeURI($_GET['filtra']));
            } else {
                data = dados;
            }

            let code = "";
            let bgcodes = "";

            if (typeof $_GET['titulo'] != 'undefined' && $_GET['titulo'] != null && $_GET['titulo'] != '') {
               code += `<h1>${decodeURI($_GET['titulo'])}</h1>`;
            }
            

            for (let i = 0; i < data.length; i++) {

                    code += `<div onclick='mostra(${i})' class="listaitem">
                            ${dados[i].AutorPrincipal}<br>
                            <div class="blocotermos">
                                <div>${dados[i].Conceito}</div>
                                <div style="opacity: 0.5; text-align: right;">${dados[i].ConceitoEN}</div>    
                            </div>
                            
                        </div>`;
 
            }

            code += `<p style="border-top: 1px solid var(--ranoyav2-border, #88888844);margin-top: 0;"></p>`;

            document.getElementById("conteudo").innerHTML = code;


        }

        omnifilterfetchcsvdata(GoogleSheetCsvURL("https://docs.google.com/spreadsheets/d/1Hja-7ozKTpcfhVX9sc3FkDH-NLj_RXllFIDTO8EIFV0/edit?gid=704178536#gid=704178536"), "filtrador");

        

        let abrefecha = "";

        document.addEventListener("keydown", function (event) {

            clearTimeout(abrefecha);

            
            
            document.getElementById("inputwrap").style.display = "flex";
            document.getElementById('filtrador').focus();

            abrefecha = setTimeout(function () {

                document.getElementById("inputwrap").style.display = "none";
            },2500);

          });

          if ($_GET['filtra'] != null && $_GET['filtra'] != undefined && $_GET['filtra'] != "") {

            let inpt = document.getElementById("shadowfiltro");
            inpt.value = $_GET['filtra'];
            inpt.dispatchEvent(new Event('input', { bubbles: true }));

          }

          if ($_GET['bg'] != null && $_GET['bg'] != undefined && $_GET['bg'] != "") {
            document.documentElement.style.setProperty('--ranoyav2-bg', `#${$_GET['bg']}`);
          }
          
           if ($_GET['fg'] != null && $_GET['fg'] != undefined && $_GET['fg'] != "") {
            document.documentElement.style.setProperty('--ranoyav2-text', `#${$_GET['fg']}`);
            document.documentElement.style.setProperty('--ranoyav2-border', `#${$_GET['fg']}44`);

          }
    </script>
