<html>
 <head>
   <style>
     .rotacionado {
  transform: rotate(10deg);
  background-color: #3498db;
  color: white;
  padding: 20px;
  display: inline-block;
}

.escalado {
  transform: scale(1.2);
  background-color: #e74c3c;
  color: white;
  padding: 20px;
  display: inline-block;
  margin-left: 20px;
}
   </style>
 </head>
 <body>
     <div class="rotacionado">Rotacionado 10°</div>
<div class="escalado">Escalado 1.2x</div>
 </body>
</html>
