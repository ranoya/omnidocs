<html>
 <head>
   <style>
     .grid-colunas {
  display: grid;
  grid-template-columns: 200px 1fr 1fr;
  gap: 10px;
  background-color: #ecf0f1;
  padding: 10px;
}

.grid-item {
  background-color: #9b59b6;
  color: white;
  padding: 20px;
  text-align: center;
}
   </style>
 </head>
 <body>
     <div class="grid-colunas">
  <div class="grid-item">200px</div>
  <div class="grid-item">1fr</div>
  <div class="grid-item">1fr</div>
</div>
 </body>
</html>
