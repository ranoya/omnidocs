<html>
 <head>
   <style>
     .visivel {
  visibility: visible;
  background-color: #2ecc71;
  color: white;
  padding: 15px;
}

.invisivel {
  visibility: hidden;
  background-color: #e74c3c;
  color: white;
  padding: 15px;
}
   </style>
 </head>
 <body>
     <div class="visivel">Elemento visível</div>
<div class="invisivel">Elemento invisível (mas ocupa espaço)</div>
<div class="visivel">Elemento visível depois do invisível</div>
 </body>
</html>
