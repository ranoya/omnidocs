<html>
 <head>
   <style>
     .overflow-hidden {
  width: 200px;
  height: 80px;
  overflow: hidden;
  background-color: #ecf0f1;
  border: 2px solid #333;
  padding: 10px;
}

.overflow-scroll {
  width: 200px;
  height: 80px;
  overflow: scroll;
  background-color: #ecf0f1;
  border: 2px solid #333;
  padding: 10px;
  margin-top: 10px;
}
   </style>
 </head>
 <body>
     <div class="overflow-hidden">Este é um texto muito longo que ultrapassa o container e será cortado porque o overflow está hidden.</div>
<div class="overflow-scroll">Este é um texto muito longo que ultrapassa o container mas você pode rolar para ver todo o conteúdo.</div>
 </body>
</html>
