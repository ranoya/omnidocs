<html>
 <head>
   <style>
     .grid-linhas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 100px 50px;
  gap: 10px;
  background-color: #ecf0f1;
  padding: 10px;
}

.grid-item {
  background-color: #e74c3c;
  color: white;
  padding: 20px;
  text-align: center;
}
   </style>
 </head>
 <body>
     <div class="grid-linhas">
  <div class="grid-item">100px altura</div>
  <div class="grid-item">100px altura</div>
  <div class="grid-item">50px altura</div>
  <div class="grid-item">50px altura</div>
</div>
 </body>
</html>
