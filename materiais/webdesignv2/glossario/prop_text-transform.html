<html>
 <head>

     .maiuscula {

}

.minuscula {

}

.capitalizado {
  text-transform: capitalize;
}
   </style>
 </head>
 <body>
     <p class="maiuscula">texto em maiúsculas</p>
<p class="minuscula">TEXTO EM MINÚSCULAS</p>

 </body>
</html>
