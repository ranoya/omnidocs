<html>
 <head>
   <style>
     .cursor-pointer {
  cursor: pointer;
  background-color: #3498db;
  color: white;
  padding: 15px;
  display: inline-block;
}

.cursor-nao-permitido {
  cursor: not-allowed;
  background-color: #e74c3c;
  color: white;
  padding: 15px;
  display: inline-block;
  margin-left: 10px;
}
   </style>
 </head>
 <body>
     <div class="cursor-pointer">Cursor pointer</div>
<div class="cursor-nao-permitido">Cursor não permitido</div>
 </body>
</html>
