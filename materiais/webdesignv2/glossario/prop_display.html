<html>
 <head>
   <style>
     .bloco {
  display: block;
  background-color: #3498db;
  color: white;
  padding: 10px;
}

.inline {
  display: inline;
  background-color: #e74c3c;
  color: white;
  padding: 10px;
}

.inline-block {
  display: inline-block;
  background-color: #2ecc71;
  color: white;
  padding: 10px;
  width: 100px;
}
   </style>
 </head>
 <body>
     <div class="bloco">Display block</div>
<span class="inline">Inline 1</span>
<span class="inline">Inline 2</span>
<div class="inline-block">Inline-block</div>
 </body>
</html>
