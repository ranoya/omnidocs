<html>
 <head>
   <style>
     @keyframes pulsar {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.animado {
  background-color: #9b59b6;
  color: white;
  padding: 20px;
  animation: pulsar 2s infinite;
}
   </style>
 </head>
 <body>
     <div class="animado">Elemento animado</div>
 </body>
</html>
